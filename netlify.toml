# Netlify deployment config for this Next.js 14 App Router project.
#
# Netlify's official Next.js runtime (@netlify/plugin-nextjs) handles SSR,
# Server Actions, Route Handlers, and ISR automatically — no manual
# adapter config needed beyond this file and the plugin below.
#
# IMPORTANT: Set the same environment variables from .env.example in
# Netlify's dashboard under Site settings → Environment variables before
# deploying. NEXT_PUBLIC_SITE_URL should be your real Netlify URL (or
# custom domain) once known, not localhost.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Server Actions (used throughout src/app/admin and the public enquiry/
# contact forms) require Netlify Functions, which the plugin above wires
# up automatically — no redirects/rewrites needed for that specifically.

# Cache static assets aggressively; Next.js fingerprints them so this is
# safe.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
